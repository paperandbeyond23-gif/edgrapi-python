[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "edgrapi"
version = "1.1.0"
description = "US government data as clean JSON — SEC EDGAR filings, SAM.gov contracts, USAspending awards, Grants.gov grants and Congress trades. Zero dependencies."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
authors = [{ name = "Paper and Beyond", email = "support@edgrapi.com" }]
keywords = [
    "sec", "edgar", "sec-edgar", "filings", "13f", "form-4", "8-k", "13d",
    "insider-trading", "xbrl", "fundamentals", "finance", "fintech",
    "sam-gov", "usaspending", "grants-gov", "govcon", "government-data",
    "federal-contracts", "congress-trading",
    "stocks", "equity-research", "financial-data", "api-client", "mcp",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://edgrapi.com"
Documentation = "https://edgrapi.com/docs"
Repository = "https://github.com/paperandbeyond23-gif/edgrapi-python"
Issues = "https://github.com/paperandbeyond23-gif/edgrapi-python/issues"
Changelog = "https://github.com/paperandbeyond23-gif/edgrapi-python/blob/main/CHANGELOG.md"

[project.scripts]
edgrapi = "edgrapi.cli:main"

[tool.setuptools]
packages = ["edgrapi"]

[tool.setuptools.package-data]
edgrapi = ["py.typed"]
